name: Validate

on:
  pull_request:
  push:
    branches: [main, stable]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.10.2'
          python-version: '3.13'
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q

  plugin-contract:
    # Enable after publication; absence means NOT VERIFIED, not a passing contract.
    if: ${{ vars.AGENT_SKILLS_CONTRACT_REF != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project-blueprints
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agent-skills
          ref: ${{ vars.AGENT_SKILLS_CONTRACT_REF }}
          path: agent-skills
          persist-credentials: false
      - run: python3 project-blueprints/scripts/check_plugin_contract.py agent-skills
