; This comment-only example is not loaded by platformio.ini.
; Before adding a board environment, explicitly review and pin:
; board/revision, platform/version, framework/SDK, toolchain/version, C++ standard,
; resource budgets, boot/reset safe state, pins/polarity and all affected variants.
; No board ID, pin, peripheral, upload, serial or network settings are supplied.
; Keep native as the default until an explicit target decision changes it.
;
; [env:reviewed_board]
; platform = <reviewed-platform>@<reviewed-version>
; board = <reviewed-board-id>
; framework = <reviewed-framework>
; platform_packages = <reviewed-toolchain>@<reviewed-version>
; build_flags = -std=c++17
